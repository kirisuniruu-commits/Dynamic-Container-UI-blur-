name: Build .levipack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK (preinstalled on the runner)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -d "$NDK" || { echo "NDK not found"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Configure (arm64-v8a)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target dynamic_container_ui_blur --parallel

      - name: Package .levipack
        run: bash scripts/package.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-container-ui-blur
          path: |
            dist/dynamic-container-ui-blur.levipack
            dist/dynamic-container-ui-blur/libdynamic_container_ui_blur.so

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dynamic-container-ui-blur.levipack
            dist/dynamic-container-ui-blur/libdynamic_container_ui_blur.so
